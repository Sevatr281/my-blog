<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Всеволод Т-П">

    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="stylesheet" href="css/general_styles.css">
    <link rel="stylesheet" href="css/contacts.css">

    <title>Личный блог — Контакты</title>
</head>

<body>
    <header class="header">
        <div class="wrapper header-wrapper">
            <a href="index.html" class="logo-link" aria-label="На главную">
                <img src="images/logo.png" alt="Логотип" class="logo">
            </a>

            <nav class="nav" aria-label="Основная навигация">
                <button class="burger" id="burger_btn" type="button" aria-label="Открыть меню">
                    ☰
                </button>

                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="index.html">Главная</a>
                    </li>

                    <li class="nav-item">
                        <a href="about_me.html">Обо мне</a>
                    </li>

                    <li class="nav-item active">
                        <a href="contacts.html" aria-current="page">Контакты</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main">
        <section class="contact-section" aria-labelledby="contact-form-title">
            <h1 id="contact-form-title" class="page-title">
                Форма обратной связи
            </h1>

            <form class="contact-form" action="#" method="post">
                <div class="form-field">
                    <label for="name">Имя</label>

                    <input 
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Введите имя"
                        required
                        minlength="2"
                        maxlength="50">
                </div>

                <div class="form-field">
                    <label for="email">Почта</label>

                    <input 
                        type="email"
                        id="email"
                        name="email"
                        placeholder="inbox@mail.ru"
                        required
                        maxlength="400">
                </div>

                <div class="form-field">
                    <label for="topic">Тема</label>

                    <select name="topic" id="topic" required>
                        <option value="" selected disabled>Выберите тему</option>
                        <option value="question">Вопрос</option>
                        <option value="feedback">Отзыв</option>
                        <option value="proposition">Предложение</option>
                        <option value="collaboration">Сотрудничество</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="message">Сообщение</label>

                    <textarea 
                        name="message" 
                        id="message" 
                        placeholder="Введите сообщение" 
                        required
                        maxlength="500"
                        rows="6"></textarea>
                </div>

                <div class="form-checkbox">
                    <input 
                        type="checkbox" 
                        id="agreement" 
                        name="agreement" 
                        required>

                    <label for="agreement">
                        Я согласен на обработку моих данных
                    </label>
                </div>

                <button class="form-button" type="submit">
                    Отправить
                </button>
            </form>
        </section>

        <section class="map-section" aria-labelledby="map-title">
            <h2 id="map-title" class="section-title">
                Я тут ↓
            </h2>

            <div class="map-wrapper">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d940.0880200176613!2d37.81991264129186!3d55.9161096218582!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sru!2sru!4v1774373413807!5m2!1sru!2sru"
                    title="Карта с местоположением автора"
                    loading="lazy"
                    allowfullscreen
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 Личный блог</p>
    </footer>
</body>
</html>
